*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#2C2740; --soft:#78718F; --faint:#A49CB8;
  --bg:#FCFBFF; --card:#FFFFFF;
  --line:#EBE7F4; --line2:#DED8EC;
  --pink:#FCE7F0; --mint:#E0F3EA; --lilac:#EDE7FD; --peach:#FDEEDF; --sky:#E4EFFC; --lemon:#FBF3DA;
  --ok:#4FA87E; --warn:#D99A4E; --bad:#D96A79;
  --sh:0 1px 2px rgba(44,39,64,.04), 0 6px 20px rgba(44,39,64,.055);
  --sh-s:0 1px 2px rgba(44,39,64,.05);
}
html{overflow-x:hidden}
body{
  font-family:'Cuerpo',system-ui,-apple-system,sans-serif;font-weight:400;font-size:15.5px;
  color:var(--ink);background:var(--bg);line-height:1.45;letter-spacing:.002em;
  background-image:radial-gradient(circle at 10% 0%, #FBEEF6 0, transparent 42%),
                   radial-gradient(circle at 92% 2%, #EAF2FC 0, transparent 38%);
  background-attachment:fixed;
  padding:max(18px, env(safe-area-inset-top)) 16px 128px;
  max-width:600px;margin:0 auto;min-height:100%}

h1,h2,h3,.serif{font-family:'Serifa',Georgia,serif;font-weight:600;letter-spacing:-.012em}
h1{font-size:1.72rem;line-height:1.14}
h2{font-size:1.32rem;line-height:1.18}
.sub{font-family:'Serifa',Georgia,serif;font-weight:400;font-size:.95rem;color:var(--soft);
  line-height:1.3;margin-top:3px}
.muted{color:var(--soft);font-size:.88rem}

/* ---------- piezas base ---------- */
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
.btn{font-family:'Cuerpo',system-ui,sans-serif;font-weight:500;font-size:.95rem;color:var(--ink);
  cursor:pointer;background:var(--card);border:1px solid var(--line2);border-radius:13px;
  box-shadow:var(--sh-s);padding:10px 16px;transition:background .12s, transform .1s}
.btn:active{transform:scale(.97);background:#F6F3FC}
.btn-main{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn-main:active{background:#3E3758}
.btn-round{width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center;
  font-size:1.15rem;flex:0 0 auto;color:var(--soft)}
.btn-round svg{width:19px;height:19px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9C93B5 50%),
  linear-gradient(135deg,#9C93B5 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size:5px 5px, 5px 5px;background-repeat:no-repeat;padding-right:34px}
input,select{font-family:'Cuerpo',system-ui,sans-serif;font-weight:400;font-size:1rem;color:var(--ink);
  width:100%;background:#FCFBFE;border:1px solid var(--line2);border-radius:12px;
  padding:11px 13px;outline:none;transition:border-color .15s, background .15s}
input::placeholder{color:var(--faint)}
input:focus,select:focus{border-color:#B9AEDC;background:#fff}

/* ---------- encabezado ---------- */
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
header .txt{flex:1;min-width:0}
.titulo-tienda{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- tarjetas de tienda ---------- */
.tiendas{display:grid;grid-template-columns:1fr 1fr;gap:13px;grid-auto-rows:1fr}
.tienda{border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);
  padding:15px 14px 13px;cursor:pointer;position:relative;overflow:hidden;text-align:left;
  transition:transform .1s, box-shadow .15s}
.tienda:active{transform:scale(.975)}
.tienda .ficha{width:38px;height:38px;border:1px solid rgba(44,39,64,.1);border-radius:12px;
  background:rgba(255,255,255,.75);display:grid;place-items:center;margin-bottom:11px}
.tienda .ficha svg{width:23px;height:23px}
.tienda h3{font-size:1.07rem;line-height:1.18;margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tienda .n{font-size:.82rem;color:#5F586F;letter-spacing:.004em}
.tienda .mini{height:5px;border-radius:4px;background:rgba(255,255,255,.75);
  margin-top:10px;overflow:hidden}
.tienda .mini i{display:block;height:100%;border-radius:4px}
.nueva{background:transparent;border:1px dashed var(--line2);box-shadow:none;
  display:grid;place-items:center;min-height:128px;color:var(--soft);
  border-radius:20px;cursor:pointer;font-family:'Serifa',Georgia,serif;font-size:.97rem;
  gap:2px;padding:12px;transition:border-color .15s,color .15s}
.nueva:active{border-color:#B9AEDC;color:var(--ink)}
.nueva span{font-size:1.6rem;line-height:1;font-family:'Cuerpo',sans-serif;font-weight:400}

/* ---------- presupuesto ---------- */
.presu{padding:16px}
.presu .etq{font-family:'Serifa',Georgia,serif;font-size:.95rem;color:var(--soft)}
.cifras{display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;row-gap:3px;
  align-items:end}
.cifras.dos{grid-template-columns:1fr auto}
.et{font-family:'Serifa',Georgia,serif;font-size:.8rem;color:var(--soft);line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font-family:'Serifa',Georgia,serif;font-weight:600;font-size:1.18rem;line-height:1.05;
  letter-spacing:-.015em;white-space:nowrap}
.et.fuerte{color:var(--ink);opacity:.72}
.v.grande{font-size:1.74rem}
.der{text-align:right}
.centro{text-align:center}
.v.verde{color:var(--ok)} .v.rojo{color:var(--bad)}
.proyeccion{font-size:.85rem;color:var(--soft);margin-top:1px}
.proyeccion b{color:var(--ink);font-weight:500}
.barra{height:9px;border-radius:5px;background:#F1EDF8;margin:12px 0 8px;
  overflow:hidden;display:flex}
.barra i{display:block;height:100%;transition:width .3s}
.barra .gastado{background:var(--ok)}
.barra .porllevar{background:repeating-linear-gradient(45deg,#CDE8DB 0 4px,#EDF7F2 4px 8px)}
.barra.alto .gastado{background:var(--warn)}
.barra.alto .porllevar{background:repeating-linear-gradient(45deg,#F3DFC2 0 4px,#FBF4EA 4px 8px)}
.barra.pasado .gastado{background:var(--bad)}
.barra.pasado .porllevar{background:repeating-linear-gradient(45deg,#F2D2D8 0 4px,#FBEFF1 4px 8px)}
.leyenda{display:flex;gap:14px;font-size:.81rem;color:var(--soft);flex-wrap:wrap}
.leyenda b{color:var(--ink);font-weight:500}
.aviso{margin-top:11px;background:#FDF2F4;border:1px solid #F2DDE1;border-radius:12px;
  padding:9px 12px;font-size:.86rem;color:#A6505F;line-height:1.35}
.sin-presu{display:flex;gap:9px;align-items:center}
.sin-presu input{flex:1}

/* ---------- resumen fijo al bajar ---------- */
.mini-presu{position:fixed;top:0;left:0;right:0;z-index:25;
  background:rgba(252,251,255,.93);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:8px 16px calc(8px + env(safe-area-inset-top));
  transform:translateY(-110%);transition:transform .22s ease;pointer-events:none}
.mini-presu.on{transform:translateY(0)}
.mini-presu .mp{display:flex;align-items:baseline;gap:4px;max-width:600px;margin:0 auto;
  justify-content:space-between}
.mini-presu .u{display:flex;align-items:baseline;gap:5px;min-width:0}
.mini-presu .ml{font-family:'Serifa',Georgia,serif;font-size:.73rem;color:var(--soft);
  white-space:nowrap}
.mini-presu .mv{font-family:'Serifa',Georgia,serif;font-weight:600;font-size:.98rem;
  white-space:nowrap}
.mini-presu .mv.grande{font-size:1.2rem}
.mini-presu .barra{margin:7px auto 0;height:5px;max-width:600px}

/* ---------- formulario ---------- */
form{padding:12px}
form .r1{margin-bottom:8px}
form .r2{display:flex;gap:8px}
.r2 .q{flex:0 0 62px;text-align:center;padding:11px 4px}
.r2 .p{flex:1 1 60px;min-width:0}
.r2 .btn{flex:0 0 auto;padding:11px 17px}

/* ---------- anadir rapido ---------- */
.rapido{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;margin:-6px 0 4px;
  scrollbar-width:none}
.rapido::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;
  font-family:'Cuerpo',sans-serif;font-size:.85rem;color:var(--ink);cursor:pointer;
  box-shadow:var(--sh-s);white-space:nowrap}
.chip:active{background:#F6F3FC}
.chip .bolsita{border-radius:999px}
.rapido .et-rapido{flex:0 0 auto;align-self:center;font-family:'Serifa',Georgia,serif;
  font-size:.8rem;color:var(--soft);padding-right:2px}

/* ---------- lista ---------- */
.cat{margin:22px 0 9px;font-family:'Serifa',Georgia,serif;font-weight:400;font-size:.95rem;
  color:var(--soft);display:flex;align-items:center;gap:10px}
.cat::after{content:'';flex:1;height:1px;background:var(--line)}
ul{list-style:none}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--sh-s);padding:10px 12px;margin-bottom:8px;
  transition:opacity .15s, background .15s}
li.done{background:#FAF9FD;box-shadow:none;opacity:.6}
li.done .nom{text-decoration:line-through;text-decoration-thickness:1px;
  text-decoration-color:var(--faint)}

/* bolsita transparente con el producto adentro */
.bolsita{flex:0 0 auto;position:relative;display:grid;place-items:center;overflow:hidden;
  background:var(--tono);border:1px solid rgba(44,39,64,.07);border-radius:13px}
.bolsita svg{width:74%;height:74%;position:relative;z-index:1}
.bolsita .brillo{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.8) 0 12%,rgba(255,255,255,0) 25%,
             rgba(255,255,255,0) 60%,rgba(255,255,255,.45) 67%,rgba(255,255,255,0) 79%)}

.cuerpo{flex:1;min-width:0}
.nom{font-weight:500;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:.79rem;color:var(--soft);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barato{display:inline-block;margin-top:4px;max-width:100%;background:#EAF5EF;color:#3B8862;
  border-radius:999px;padding:2px 9px;font-size:.74rem;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check{flex:0 0 auto;width:25px;height:25px;border:1.5px solid var(--line2);border-radius:50%;
  background:#fff;display:grid;place-items:center;cursor:pointer;padding:0;transition:all .15s}
.check svg{width:13px;height:13px;opacity:0}
li.done .check{background:var(--ok);border-color:var(--ok)}
li.done .check svg{opacity:1}
.estrella{flex:0 0 auto;background:none;border:none;padding:3px;cursor:pointer;line-height:0}
.estrella svg{width:19px;height:19px;fill:none;stroke:#CFC7E0;stroke-width:1.6;
  transition:fill .15s, stroke .15s}
.estrella[aria-pressed="true"] svg{fill:#F2C14E;stroke:#D9A227}
li.clave{border-color:#F0DFB4;background:linear-gradient(90deg,#FFFCF4 0,#fff 46%)}
.cat.clave-cat{color:#B4892C}
.cat.clave-cat::after{background:#F0E2BE}
.quitar{flex:0 0 auto;background:none;border:none;color:var(--faint);font-size:1.3rem;
  line-height:1;padding:2px 3px;cursor:pointer;font-family:inherit}

/* edicion rapida */
.editor{padding:0 12px 11px;margin:-4px 0 9px}
.editor input{padding:9px 11px}
.editor .f1{margin-bottom:8px}
.editor select{width:100%;font-family:'Cuerpo',system-ui,sans-serif;font-size:.95rem;
  color:var(--ink);background:#FCFBFE;border:1px solid var(--line2);border-radius:12px;
  padding:9px 11px;outline:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),
                   linear-gradient(135deg,var(--soft) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
.editor .f2{display:flex;gap:8px}
.editor .q{flex:0 0 60px;text-align:center}
.editor .btn{flex:0 0 auto;padding:9px 13px;font-size:.9rem}
.editor .borrar{color:var(--bad);border-color:#F0DCE0}

.vacio{text-align:center;color:var(--soft);padding:44px 18px;font-size:.95rem;
  font-family:'Serifa',Georgia,serif;line-height:1.5}
.vacio .em{display:block;font-size:2rem;margin-bottom:8px}

/* ---------- historial ---------- */
.historial{padding:4px 14px}
.hfila[data-recibo]{cursor:pointer}
.hfila[data-recibo]:active{opacity:.6}
.hfila{display:flex;align-items:baseline;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:.9rem}
.hfila:last-child{border-bottom:none}
.hfila span:first-child{flex:0 0 auto;color:var(--ink)}
.hfila .hn{flex:1;text-align:left;font-size:.8rem;color:var(--faint)}
.hfila b{font-family:'Serifa',Georgia,serif;font-weight:600;font-size:1rem}
.hfila.htot{border-top:1px solid var(--line2)}
.hfila.htot span:first-child,.hfila.htot b{color:var(--soft)}

/* ---------- todas las tiendas juntas ---------- */
.bloque-tienda{border:1px solid var(--line);border-radius:14px;margin:18px 0 2px;
  box-shadow:var(--sh-s);overflow:hidden}
.bloque-tienda:first-child{margin-top:4px}
.cab-tienda{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:11px 14px;cursor:pointer;color:#2C2740}
.cab-tienda span:first-child{font-family:'Serifa',Georgia,serif;font-weight:600;font-size:1.05rem;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cuenta-mini{font-size:.8rem;color:#554E6B;white-space:nowrap}

/* ---------- barra inferior ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(252,251,255,.9);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:11px 16px calc(13px + env(safe-area-inset-bottom));display:flex;gap:9px;justify-content:center}
.bar .btn{font-size:.87rem;padding:9px 14px;box-shadow:none}

/* ---------- hoja modal ---------- */
.fondo{position:fixed;inset:0;background:rgba(44,39,64,.32);z-index:40;display:none}
.fondo.on{display:block}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);
  border-top:1px solid var(--line);border-radius:24px 24px 0 0;
  box-shadow:0 -8px 40px rgba(44,39,64,.14);
  padding:20px 18px calc(22px + env(safe-area-inset-bottom));
  max-width:600px;margin:0 auto;transform:translateY(102%);transition:transform .24s}
.hoja.on{transform:translateY(0)}
.hoja h2{margin-bottom:14px}
.hoja label{display:block;font-family:'Serifa',Georgia,serif;font-size:.88rem;
  color:var(--soft);margin:13px 0 6px}
.colores{display:flex;gap:10px;flex-wrap:wrap}
.colores button{width:40px;height:40px;border:1px solid var(--line2);border-radius:12px;
  cursor:pointer;transition:box-shadow .15s}
.colores button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.hoja .acciones{display:flex;gap:10px;margin-top:18px}
.hoja .acciones .btn{flex:1}
.btn.peligro{background:#FDF2F4;color:#B8566A;border-color:#F2DDE1}
.btn.confirmar{background:#D96A79;color:#fff;border-color:#D96A79}
.respaldo{display:flex;gap:9px;justify-content:center;margin-top:26px}
.respaldo .btn{font-size:.88rem;padding:9px 15px}
.pie{text-align:center;font-family:'Serifa',Georgia,serif;font-size:.84rem;color:var(--faint);
  margin-top:26px;padding:0 12px;line-height:1.5}

/* ---------- recibo ---------- */
.capa-recibo{position:fixed;inset:0;z-index:60;background:rgba(28,24,40,.72);
  display:none;overflow-y:auto;padding:22px 16px 110px}
.capa-recibo.on{display:block}
body.con-recibo .bar,body.con-recibo .mini-presu{display:none !important}
.ticket{--papel:#F6F3EC;--tinta:#17150F;
  position:relative;max-width:420px;margin:0 auto;background:var(--papel);color:var(--tinta);
  font-family:'Tickete',ui-monospace,monospace;font-size:.84rem;line-height:1.5;
  padding:26px 22px 30px;letter-spacing:.02em;
  box-shadow:0 14px 44px rgba(0,0,0,.3);
  background-image:repeating-linear-gradient(180deg,rgba(0,0,0,.016) 0 1px,transparent 1px 3px)}
.ticket::before,.ticket::after{content:'';position:absolute;left:0;right:0;height:10px;
  background:
    linear-gradient(-45deg, transparent 50.5%, var(--papel) 51%) 0 0/14px 14px repeat-x,
    linear-gradient(45deg, transparent 50.5%, var(--papel) 51%) 0 0/14px 14px repeat-x}
.ticket::before{top:-10px;transform:scaleY(-1)}
.ticket::after{bottom:-10px}
.tk-centro{text-align:center}
.tk-corazon{display:block;width:52px;margin:0 auto 12px}
.tk-marca{font-size:.82rem;letter-spacing:.3em;text-transform:uppercase;word-break:break-word}
.tk-sub{font-size:.72rem;letter-spacing:.18em;color:#6E685A;margin-top:3px}
.tk-titulo{font-weight:700;font-size:1.55rem;letter-spacing:.06em;margin:14px 0 2px;
  line-height:1.1}
.tk-datos{font-size:.76rem;letter-spacing:.08em;margin-top:9px}
.tk-linea{border-top:1px dashed #9B948440;margin:14px 0}
.tk-item{display:flex;gap:10px;align-items:baseline;margin-bottom:7px}
.tk-item .tn{flex:1;min-width:0;word-break:break-word}
.tk-item .tx{color:#6E685A;font-size:.76rem}
.tk-item .tp{flex:0 0 auto;font-variant-numeric:tabular-nums}
.tk-total{display:flex;justify-content:space-between;align-items:baseline;
  font-weight:700;font-size:1.12rem;letter-spacing:.04em;margin:4px 0}
.tk-nota{text-align:center;font-size:.74rem;letter-spacing:.16em;color:#6E685A;margin:14px 0 12px}
.tk-barras{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:54px;
  margin:0 auto 8px;max-width:270px}
.tk-barras i{display:block;background:var(--tinta);height:100%}
.tk-codigo{text-align:center;font-size:.8rem;letter-spacing:.3em}
.recibo-botones{max-width:420px;margin:26px auto 0;display:flex;gap:9px}
.recibo-botones .btn{flex:1}

/* ---------- hueco para el distintivo del alojamiento ---------- */
body.con-badge{padding-bottom:190px}
body.con-badge .bar{padding-bottom:calc(64px + env(safe-area-inset-bottom))}

/* ---------- modo oscuro ---------- */
:root[data-modo="oscuro"]{
    --ink:#EEEAF7; --soft:#A8A0BE; --faint:#766E8C;
    --bg:#141220; --card:#1C1A28;
    --line:#2A2638; --line2:#39334C;
    --ok:#5FB98E; --warn:#D9A862; --bad:#E58196;
    --sh:0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.3);

[data-modo="oscuro"] .capa-recibo{background:rgba(0,0,0,.8)}[data-modo="oscuro"] .btn.peligro{background:#2C1D24;color:#E58196;border-color:#4A2E39}[data-modo="oscuro"] .chip:active{background:#262235}[data-modo="oscuro"] select{background-image:linear-gradient(45deg,transparent 50%,#8A82A3 50%),
    linear-gradient(135deg,#8A82A3 50%,transparent 50%)}
</style>
</head>
<script>
(function(){
  var tema = 'auto';
  try{ var d = JSON.parse(localStorage.getItem('lista-compras-v2') || '{}');
       if(d && d.tema) tema = d.tema; }catch(e){}
  if(tema !== 'claro' && tema !== 'oscuro'){
    tema = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ? 'oscuro' : 'claro';
  }
  document.documentElement.setAttribute('data-modo', tema);
})();
</script>

function quitarTildes(s){
  return s.toLowerCase()
    .replace(/[áà]/g,'a').replace(/[éè]/g,'e').replace(/[íì]/g,'i')
    .replace(/[óò]/g,'o').replace(/[úùü]/g,'u');
}
function iconoDe(nombre){
  const n = ' ' + quitarTildes(nombre) + ' ';
  for(const [re, key] of CLAVES){ if(re.test(n)) return key; }
  return 'bolsa';
}
/* devuelve el HTML de la bolsita con el producto dentro */
function bolsita(nombre, tam, forzado){
  const k = forzado || iconoDe(nombre);
  const t = TONO[k] || '#EDF1F6';
  return '<span class="bolsita" style="--tono:' + t + ';width:' + tam + 'px;height:' + tam + 'px">'
    + '<svg viewBox="0 0 32 32" aria-hidden="true">' + I[k] + '</svg>'
    + '<i class="brillo"></i></span>';
}

function cargar(){
  try{
    const crudo = localStorage.getItem(LLAVE);
    if(crudo){ db = JSON.parse(crudo); }
    else {
      const viejo = localStorage.getItem('lista-compras-v1');
      db = {memoria:{}, tiendas:[{id:id(), nombre:'Mi lista', color:PALETA[2], presupuesto:0,
        historial:[], items: viejo ? JSON.parse(viejo).map(i => ({...i, id:id()})) : []}]};
    }
  }catch(e){ db = {tiendas:[], memoria:{}}; }
  if(!db.tiendas) db.tiendas = [];
  if(!db.memoria) db.memoria = {};
  db.tiendas.forEach(t => {
    if(!t.historial) t.historial = [];
    /* los recibos viejos llevaban una numeracion global: se renumeran por tienda */
    const orden = t.historial.slice().reverse();
    orden.forEach((e, i) => { e.pedido = String(i + 1); });
    t.compras = orden.length;
  });
}
function guardar(){ try{ localStorage.setItem(LLAVE, JSON.stringify(db)); }catch(e){} }
function id(){ return Math.random().toString(36).slice(2,9); }
function dinero(n){ return '$' + (Math.round(n*100)/100).toFixed(2); }
function numero(v){ const n = parseFloat(String(v).replace(',','.')); return isFinite(n) && n>0 ? n : 0; }
function esc(s){ return String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function tienda(){ return db.tiendas.find(t => t.id === vista.tiendaId); }

/* ---- memoria de precios: que recuerde lo que pagaste ---- */
function llave(nombre){ return quitarTildes(nombre).trim().replace(/\s+/g,' '); }
function recordar(nombre, precio, tiendaId){
  if(!precio) return;
  const k = llave(nombre);
  if(!k) return;
  const m = db.memoria[k] || (db.memoria[k] = {nombre, veces:0, precio:0, tiendas:{}});
  m.nombre = nombre; m.precio = precio; m.veces++; m.tiendas[tiendaId] = precio;
}
function recordado(nombre){ return db.memoria[llave(nombre)] || null; }
/* precio que conviene sugerir: el de esta tienda si existe, si no el ultimo visto */
function precioSugerido(nombre, tiendaId){
  const m = recordado(nombre);
  if(!m) return 0;
  return m.tiendas[tiendaId] || m.precio || 0;
}
function masBarato(nombre, tiendaActual, precioActual){
  const m = recordado(nombre);
  if(!m) return null;
  let mejor = null;
  for(const tid in m.tiendas){
    if(tid === tiendaActual) continue;
    const ti = db.tiendas.find(x => x.id === tid);
    if(!ti) continue;
    const p = m.tiendas[tid];
    if(p > 0 && (precioActual <= 0 || p < precioActual) && (!mejor || p < mejor.precio))
      mejor = {nombre: ti.nombre, precio: p};
  }
  return mejor;
}
function hoyISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')
    + '-' + String(d.getDate()).padStart(2,'0');
}
function fechaCorta(iso){
  const M = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const p = iso.split('-');
  return Number(p[2]) + ' ' + M[Number(p[1])-1] + ' ' + p[0];
}
/* guarda la compra cerrada, sin contar dos veces lo mismo */
function registrarCompra(t){
  const nuevos = t.items.filter(i => i.hecho && !i.contado);
  if(!nuevos.length) return null;
  const total = nuevos.reduce((s,i) => s + i.precio * (numero(i.cant)||1), 0);
  nuevos.forEach(i => { i.contado = true; });
  if(!t.historial) t.historial = [];
  const f = hoyISO();
  const copias = nuevos.map(i => ({nombre:i.nombre, cant:i.cant, precio:i.precio}));
  /* cada cierre de compra es un pedido propio, aunque sea el mismo dia */
  t.compras = (t.compras || 0) + 1;
  const e = {f, total, n:nuevos.length, items:copias, presupuesto:t.presupuesto,
             pedido:String(t.compras)};
  t.historial.unshift(e);
  t.historial = t.historial.slice(0, 24);
  return e;
}
function frecuentes(n){
  return Object.values(db.memoria)
    .filter(m => m.veces >= 2)
    .sort((a,b) => b.veces - a.veces)
    .slice(0, n);
}
function cuentas(t){
  const total = t.items.reduce((s,i) => s + i.precio * (numero(i.cant)||1), 0);
  const gastado = t.items.filter(i => i.hecho)
    .reduce((s,i) => s + i.precio * (numero(i.cant)||1), 0);
  const clave = t.items.filter(i => i.clave)
    .reduce((s,i) => s + i.precio * (numero(i.cant)||1), 0);
  return {total, gastado, clave, pend: t.items.filter(i => !i.hecho).length, n: t.items.length};
}

/* todas las tiendas en una sola lista, con lo que falta de cada una */
function listaJunta(){
  const conPendientes = db.tiendas.filter(t => t.items.some(i => !i.hecho));
  if(!conPendientes.length){
    return '<div class="vacio"><span class="em">✓</span>'
      + (db.tiendas.some(t => t.items.length)
          ? 'No te falta nada por comprar.' : 'Todavía no has anotado nada.')
      + '<br>Toca el botón de arriba para volver a tus tiendas.</div>';
  }
  let h = '';
  conPendientes.forEach(t => {
    const pend = t.items.filter(i => !i.hecho);
    const total = pend.reduce((s,i) => s + i.precio * (numero(i.cant)||1), 0);

    h += '<div class="bloque-tienda" style="background:' + t.color + '">'
      + '<div class="cab-tienda" data-abrir="' + t.id + '">'
      + '<span>' + esc(t.nombre) + '</span>'
      + '<span class="cuenta-mini">' + pend.length
      + (total ? ' · ' + dinero(total) : '') + '</span></div></div>';

    const grupos = {};
    const claves = pend.filter(i => i.clave);
    const resto = pend.filter(i => !i.clave);
    resto.forEach(i => { const c = catDe(i); (grupos[c] = grupos[c] || []).push(i); });

    const pinta = (titulo, lista, esClave) => {
      h += '<div class="cat' + (esClave ? ' clave-cat' : '') + '">' + titulo + '</div><ul>';
      lista.forEach(i => {
        const bits = [];
        if(i.cant) bits.push('x' + i.cant);
        if(i.precio) bits.push(dinero(i.precio) + ' c/u');
        h += '<li class="' + (i.clave ? 'clave' : '') + '">'
          + bolsita(i.nombre, 36, icoDe(i))
          + '<div class="cuerpo"><div class="nom">' + esc(i.nombre) + '</div>'
          + (bits.length ? '<div class="meta">' + bits.join(' · ') + '</div>' : '') + '</div>'
          + '<button class="check" data-check="' + i.id + '" data-tienda="' + t.id
          + '" aria-label="Ya lo tengo">' + CHECK_SVG + '</button></li>';
      });
      h += '</ul>';
    };
    if(claves.length) pinta('Primero lo importante', claves, true);
    ORDEN.filter(c => grupos[c]).forEach(c => pinta(c, grupos[c], false));
  });
  h += '<p class="pie">Toca el nombre de una tienda para abrirla.</p>';
  return h;
}

    const queda = t.presupuesto - c.gastado;
    const pctG = Math.min(100, c.gastado / t.presupuesto * 100);
    const pctP = Math.min(100 - pctG, Math.max(0, (c.total - c.gastado) / t.presupuesto * 100));
    const clase = c.gastado > t.presupuesto ? 'pasado'
                : pasado || c.gastado / t.presupuesto > .8 ? 'alto' : '';

      + '</div>';
  } else {
    if(c.n) h += '<div class="cifras dos" style="margin-bottom:15px">'
      + '<span class="et fuerte">En el carrito</span>'
      + '<span class="et der">Si llevas todo</span>'
      + '<span class="v grande">' + dinero(c.gastado) + '</span>'

      + '<button class="btn btn-main" data-presu="1">Fijar</button></div>';

  h += '</div>';

  /* formulario */
  h += '<form class="box" id="form">'
    + '<div class="r1"><input id="f-nom" placeholder="¿Qué necesitas comprar?" autocomplete="off" required></div>'
    + '<div class="r2">'
    + '<input id="f-cant" class="q" inputmode="decimal" placeholder="1" aria-label="Cantidad">'
    + '<input id="f-precio" class="p" inputmode="decimal" placeholder="$ c/u" aria-label="Precio">'
    + '<button class="btn btn-main" type="submit">Añadir</button>'
    + '</div></form>';

  /* botones de lo que mas compra */
  const freq = frecuentes(10).filter(m => !t.items.some(i => llave(i.nombre) === llave(m.nombre)));
  if(freq.length){
    h += '<div class="rapido"><span class="et-rapido">Lo de siempre</span>'
      + freq.map(m => {
          const pr = precioSugerido(m.nombre, t.id);
          return '<button class="chip" data-rapido="' + esc(llave(m.nombre)) + '">'
            + bolsita(m.nombre, 22) + esc(m.nombre)
            + (pr ? ' · ' + dinero(pr) : '') + '</button>';
        }).join('')
      + '</div>';
  }

  /* lista */
  if(!t.items.length){
    h += '<div class="vacio"><span class="em">🧺</span>Todavía no hay nada aquí.<br>'
      + 'Escribe arriba lo primero que necesites.</div>';
  } else {
    const claves = t.items.filter(i => i.clave);
    if(claves.length){
      h += '<div class="cat clave-cat">Primero lo importante</div><ul>';
      claves.slice().sort((a,b) => a.hecho - b.hecho).forEach(i => { h += fila(i); });
      h += '</ul>';
    }
    const grupos = {};
    t.items.filter(i => !i.clave).forEach(i => {
      const c = catDe(i); (grupos[c] = grupos[c] || []).push(i); });
    ORDEN.filter(cat => grupos[cat]).forEach(cat => {
      h += '<div class="cat">' + cat + '</div><ul>';
      grupos[cat].slice().sort((a,b) => a.hecho - b.hecho).forEach(i => { h += fila(i); });
      h += '</ul>';
    });
  }

  if(t.historial && t.historial.length){
    const gastoTotal = t.historial.reduce((s,x) => s + x.total, 0);
    h += '<div class="cat">Compras anteriores</div><div class="box historial">'
      + t.historial.slice(0,6).map(x =>
          '<div class="hfila" data-recibo="' + x.pedido + '"><span>#' + x.pedido + '</span>'
          + '<span class="hn">' + fechaCorta(x.f) + ' · ' + x.n
          + (x.n === 1 ? ' producto' : ' productos') + '</span>'
          + '<b>' + dinero(x.total) + '</b></div>').join('')
      + '<div class="hfila htot"><span>En total aquí</span><span class="hn"></span>'
      + '<b>' + dinero(gastoTotal) + '</b></div></div>';
  }

  app.innerHTML = h;

  pintarMini(t, c);

  const bar = document.getElementById('bar');
  bar.style.display = 'flex';
  bar.innerHTML = '<button class="btn" data-copiar="1">Copiar lista</button>'
    + '<button class="btn" data-terminar="1">Al terminar la compra</button>';
}

function pintarMini(t, c){
  const mini = document.getElementById('mini');
  if(!t.presupuesto){ mini.classList.remove('on'); mini.dataset.activo = ''; return; }
  const queda = t.presupuesto - c.gastado;
  const pctG = Math.min(100, c.gastado / t.presupuesto * 100);
  const pctP = Math.min(100 - pctG, Math.max(0, (c.total - c.gastado) / t.presupuesto * 100));
  const clase = c.gastado > t.presupuesto ? 'pasado'
              : c.total > t.presupuesto || c.gastado / t.presupuesto > .8 ? 'alto' : '';
  mini.querySelector('.mp').innerHTML =
      '<span class="u"><span class="ml">Presup.</span><span class="mv">'
    + dinero(t.presupuesto) + '</span></span>'
    + '<span class="u"><span class="ml">Carrito</span><span class="mv grande">'
    + dinero(c.gastado) + '</span></span>'
    + '<span class="u"><span class="ml">Queda</span><span class="mv '
    + (queda < 0 ? 'rojo' : 'verde') + '">' + dinero(queda) + '</span></span>';
  mini.querySelector('.barra').className = 'barra ' + clase;
  mini.querySelector('.barra').innerHTML =
      '<i class="gastado" style="width:' + pctG + '%"></i>'
    + '<i class="porllevar" style="width:' + pctP + '%"></i>';
  mini.dataset.activo = '1';
  ajustarMini();
}
function ajustarMini(){
  const mini = document.getElementById('mini');
  if(!mini.dataset.activo){ mini.classList.remove('on'); return; }
  const caja = document.querySelector('.presu');
  const limite = caja ? caja.getBoundingClientRect().bottom : 0;
  mini.classList.toggle('on', limite < 4);
}
window.addEventListener('scroll', ajustarMini, {passive:true});

function fila(i){
  const edit = vista.editId === i.id;
  const bits = [];
  if(i.cant) bits.push('x' + i.cant);
  if(i.precio) bits.push(dinero(i.precio) + ' c/u');
  if(i.precio && (numero(i.cant)||1) !== 1) bits.push('= ' + dinero(i.precio * numero(i.cant)));
  if(!i.precio) bits.push('sin precio');
  const barato = masBarato(i.nombre, vista.tiendaId, i.precio);

  let h = '<li class="' + (i.hecho ? 'done' : '') + (i.clave ? ' clave' : '') + '">'
    + bolsita(i.nombre, 42, icoDe(i))
    + '<div class="cuerpo" data-editar="' + i.id + '">'
    + '<div class="nom">' + esc(i.nombre) + '</div>'
    + '<div class="meta">' + bits.join(' · ') + '</div>'
    + (barato ? '<div class="barato">↓ ' + dinero(barato.precio) + ' en '
        + esc(barato.nombre) + '</div>' : '') + '</div>'
    + '<button class="estrella" data-clave="' + i.id + '" aria-pressed="' + !!i.clave + '" '
    + 'aria-label="Marcar como imprescindible">' + ESTRELLA_SVG + '</button>'
    + '<button class="check" data-check="' + i.id + '" aria-label="Ya lo tengo">' + CHECK_SVG + '</button>'
    + '</li>';

  if(edit){
    h += '<div class="editor">'
      + '<div class="f1"><input id="e-nombre" value="' + esc(i.nombre) + '" '
      + 'aria-label="Nombre del producto" autocomplete="off"></div>'
      + '<div class="f1"><select id="e-cat" aria-label="Categoría">'
      + '<option value="">Categoría automática (' + catDe({nombre:i.nombre}) + ')</option>'
      + ORDEN.map(c => '<option value="' + c + '"' + (i.cat === c ? ' selected' : '') + '>'
          + c + '</option>').join('')
      + '</select></div>'
      + '<div class="f2">'
      + '<input class="q" id="e-cant" inputmode="decimal" value="' + esc(i.cant || '') + '" placeholder="1" aria-label="Cantidad">'
      + '<input id="e-precio" inputmode="decimal" value="' + (i.precio || '') + '" placeholder="$ c/u" aria-label="Precio">'
      + '<button class="btn btn-main" data-guardar="' + i.id + '">Listo</button>'
      + '<button class="btn borrar" data-quitar="' + i.id + '">Borrar</button></div></div>';
  }
  return h;
}

/* ================== recibo de la compra ================== */
const CORAZON = (function(){
  const m = ['011000110','111101111','111111111','111111111','011111110',
             '001111100','000111000','000010000'];
  let r = '';
  m.forEach((fila, y) => fila.split('').forEach((v, x) => {
    if(v === '1') r += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>';
  }));
  return '<svg class="tk-corazon" viewBox="0 0 9 8" fill="currentColor" '
    + 'shape-rendering="crispEdges">' + r + '</svg>';
})();

function barras(semilla){
  let s = 0;
  for(let i = 0; i < semilla.length; i++) s = (s * 31 + semilla.charCodeAt(i)) % 100000;
  let h = '';
  for(let i = 0; i < 44; i++){
    s = (s * 1103515 + 12345) % 2147483;
    const ancho = 1 + (s >> 7) % 4;
    const alto = 72 + (s >> 11) % 29;
    h += '<i style="width:' + ancho + 'px;height:' + alto + '%"></i>';
  }
  return '<div class="tk-barras">' + h + '</div>';
}

let reciboActual = null;

function verRecibo(t, entrada){
  if(!entrada) return;
  const capa = document.getElementById('capa-recibo');
  const items = entrada.items || [];
  const pedido = String(entrada.pedido || 1).replace(/^0+(?=\d)/, '');
  let h = '<div class="ticket">'
    + '<div class="tk-centro">' + CORAZON
    + '<div class="tk-marca">' + esc(t.nombre) + '</div>'
    + '<div class="tk-sub">lista de compras</div>'
    + '<div class="tk-titulo">RECIBO</div>'
    + '<div class="tk-datos">COMPRA N.º ' + pedido + ' EN ESTE LUGAR<br>'
    + 'FECHA: ' + fechaCorta(entrada.f).toUpperCase() + '<br>'
    + 'PRODUCTOS: ' + entrada.n + '</div></div>'
    + '<div class="tk-linea"></div>';
  items.forEach(i => {
    const cant = numero(i.cant) || 1;
    h += '<div class="tk-item"><span class="tn">' + esc(i.nombre)
      + (i.cant ? '<span class="tx"> x' + esc(i.cant) + '</span>' : '')
      + '</span><span class="tp">' + dinero(i.precio * cant) + '</span></div>';
  });
  h += '<div class="tk-linea"></div>'
    + '<div class="tk-total"><span>TOTAL</span><span>' + dinero(entrada.total) + '</span></div>';
  if(entrada.presupuesto > 0){
    const dif = entrada.presupuesto - entrada.total;
    h += '<div class="tk-item"><span class="tn tx">PRESUPUESTO</span>'
      + '<span class="tp tx">' + dinero(entrada.presupuesto) + '</span></div>'
      + '<div class="tk-item"><span class="tn tx">'
      + (dif >= 0 ? 'TE SOBRÓ' : 'TE PASASTE') + '</span>'
      + '<span class="tp tx">' + dinero(Math.abs(dif)) + '</span></div>';
  }
  h += '<div class="tk-linea"></div>'
    + '<div class="tk-nota">GRACIAS POR TU COMPRA</div>'
    + barras(pedido + entrada.f)
    + '<div class="tk-codigo">**** ' + pedido.padStart(4,'0') + ' ****</div>'
    + '</div>'
    + '<div class="recibo-botones">'
    + '<button class="btn" data-copiar-recibo="1">Copiar</button>'
    + '<button class="btn btn-main" data-cerrar-recibo="1">Listo</button></div>';
  capa.innerHTML = h;
  capa.classList.add('on');
  document.body.classList.add('con-recibo');
  capa.scrollTop = 0;
  reciboActual = {t, entrada};
}

function textoRecibo(){
  if(!reciboActual) return '';
  const t = reciboActual.t, entrada = reciboActual.entrada;
  let x = t.nombre.toUpperCase() + '\n' + fechaCorta(entrada.f) + '\n\n';
  (entrada.items || []).forEach(i => {
    const c = numero(i.cant) || 1;
    x += i.nombre + (i.cant ? ' x' + i.cant : '') + '  ' + dinero(i.precio * c) + '\n';
  });
  x += '\nTOTAL: ' + dinero(entrada.total);
  if(entrada.presupuesto > 0){
    const dif = entrada.presupuesto - entrada.total;
    x += '\nPresupuesto: ' + dinero(entrada.presupuesto)
      + '\n' + (dif >= 0 ? 'Te sobró: ' : 'Te pasaste: ') + dinero(Math.abs(dif));
  }
  return x + '\n';
}

/* ================== copia de seguridad ================== */
function nombreCopia(){
  return 'mis-listas-' + hoyISO() + '.json';
}
function exportar(){
  const texto = JSON.stringify(db);
  try{
    const blob = new Blob([texto], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombreCopia();
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    abrirHoja('<h2>Copia de tus listas</h2>'
      + '<p class="muted" style="margin-top:6px">Si tu navegador permitió la descarga, el archivo '
      + '<b>' + nombreCopia() + '</b> está en tus Descargas: guárdalo en Drive o mándatelo '
      + 'por correo.</p>'
      + '<p class="muted" style="margin-top:8px">Si no apareció nada, copia el texto con el botón '
      + 'de abajo y pégalo donde quieras guardarlo.</p>'
      + '<div class="acciones"><button class="btn" data-copiar-copia="1">Copiar el texto</button>'
      + '<button class="btn btn-main" data-cerrar="1">Listo</button></div>');
  }catch(e){ mostrarTexto(texto); }
}
function aplicarCopia(texto, btn){
  let datos;
  try{ datos = JSON.parse(texto); }catch(e){ datos = null; }
  if(!datos || !Array.isArray(datos.tiendas)){
    abrirHoja('<h2>No pude leer la copia</h2>'
      + '<p class="muted" style="margin-top:6px">El archivo no parece una copia de esta app. '
      + 'Debe ser el .json que generó el botón «Guardar copia».</p>'
      + '<div class="acciones"><button class="btn btn-main" data-cerrar="1">Entendido</button></div>');
    return;
  }
  const nt = datos.tiendas.length;
  const ni = datos.tiendas.reduce((s,x) => s + (x.items ? x.items.length : 0), 0);
  copiaPendiente = datos;
  abrirHoja('<h2>Restaurar la copia</h2>'
    + '<p class="muted" style="margin-top:6px">La copia tiene <b>' + nt + '</b> '
    + (nt === 1 ? 'tienda' : 'tiendas') + ' y <b>' + ni + '</b> productos.</p>'
    + '<p class="muted" style="margin-top:8px">Esto reemplaza todo lo que tienes ahora '
    + 'en la app. No se puede deshacer.</p>'
    + '<div class="acciones"><button class="btn" data-cerrar="1">Cancelar</button>'
    + '<button class="btn btn-main" data-confirmar-copia="1">Restaurar</button></div>');
}
let copiaPendiente = null;

/* ================== eventos ================== */
function pintar(){ vista.pantalla === 'inicio' ? verInicio() : verTienda(); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-abrir],[data-nueva],[data-volver],[data-ajustes],[data-check],[data-tema],'
    + '[data-quitar],[data-editar],[data-guardar],[data-presu],[data-copiar],[data-limpiar],[data-clave],'
    + '[data-terminar],[data-mover],[data-rapido],[data-recibo],[data-cerrar-recibo],[data-copiar-recibo],'
    + '[data-vista-junta],'
    + '[data-exportar],[data-importar],[data-confirmar-copia],[data-copiar-copia],'
    + '[data-color],[data-crear],[data-cerrar],[data-editar-tienda],[data-borrar-tienda],[data-duplicar]');
  if(!b) return;
  const d = b.dataset;
  const t = tienda();

  if(d.abrir){ vista.tiendaId = d.abrir; vista.pantalla = 'tienda'; vista.editId = null;
    window.scrollTo(0,0); return pintar(); }
  if(d.volver){ vista.pantalla = 'inicio'; vista.editId = null; window.scrollTo(0,0); return pintar(); }
  if(d.nueva) return hojaNueva();
  if(d.exportar) return exportar();
  if(d.importar){
    const campo = document.getElementById('archivo-copia');
    if(campo) campo.click();
    return;
  }
  if(d.confirmarCopia){
    if(copiaPendiente){
      db = copiaPendiente;
      if(!db.memoria) db.memoria = {};
      db.tiendas.forEach(x => { if(!x.historial) x.historial = []; });
      copiaPendiente = null;
      guardar(); aplicarTema(); cerrarHoja();
      vista.pantalla = 'inicio'; vista.tiendaId = null;
      window.scrollTo(0,0);
      return pintar();
    }
    return cerrarHoja();
  }
  if(d.copiarCopia){
    const txt = JSON.stringify(db);
    copiarTexto(txt).then(ok => { if(!ok) mostrarTexto(txt); else b.textContent = '¡Copiado!'; });
    return;
  }
  if(d.vistaJunta){ db.vistaJunta = !db.vistaJunta; guardar();
    window.scrollTo(0,0); return pintar(); }
  if(d.tema){ db.tema = temaActual() === 'oscuro' ? 'claro' : 'oscuro';
    aplicarTema(); guardar(); return pintar(); }
  if(d.ajustes) return hojaAjustes();
  if(d.terminar) return hojaTerminar();
  if(d.mover){
    const pend = t.items.filter(i => !i.hecho);
    if(!pend.length){ cerrarHoja(); return; }
    const destino = document.getElementById('h-destino').value;
    const copias = pend.map(i => ({...i, id:id(), hecho:false}));
    if(destino === 'nueva'){
      const campo = document.getElementById('h-nom');
      const nom = (campo && campo.value.trim()) || (t.nombre + ' · pendientes');
      db.tiendas.push({id:id(), nombre:nom, color:PALETA[db.tiendas.length % PALETA.length],
        presupuesto:0, historial:[], items:copias});
    } else {
      const dt = db.tiendas.find(x => x.id === destino);
      if(dt) copias.forEach(i => dt.items.push(i));
    }
    const e1 = registrarCompra(t);
    t.items = t.items.filter(i => i.hecho);
    guardar(); cerrarHoja(); pintar();
    if(e1) verRecibo(t, e1);
    return;
  }

  if(d.check){
    const dueña = d.tienda ? db.tiendas.find(x => x.id === d.tienda) : t;
    const i = dueña && dueña.items.find(x => x.id === d.check);
    if(i){ i.hecho = !i.hecho; guardar(); }
    return pintar();
  }
  if(d.quitar){ t.items = t.items.filter(x => x.id !== d.quitar);
    vista.editId = null; guardar(); return pintar(); }
  if(d.clave){ const i = t.items.find(x => x.id === d.clave); i.clave = !i.clave;
    guardar(); return pintar(); }
  if(d.rapido){
    const m = db.memoria[d.rapido];
    if(m){ const pr = precioSugerido(m.nombre, t.id);
      t.items.push({id:id(), nombre:m.nombre, cant:'', precio:pr, hecho:false});
      recordar(m.nombre, pr, t.id); guardar(); return pintar(); }
  }
  if(d.editar){ vista.editId = vista.editId === d.editar ? null : d.editar; return pintar(); }
  if(d.guardar){
    const i = t.items.find(x => x.id === d.guardar);
    const nn = document.getElementById('e-nombre').value.trim();
    if(nn) i.nombre = nn;
    const ec = document.getElementById('e-cat');
    if(ec) i.cat = ec.value || '';
    i.cant = document.getElementById('e-cant').value.trim();
    i.precio = numero(document.getElementById('e-precio').value);
    recordar(i.nombre, i.precio, t.id);
    vista.editId = null; guardar(); return pintar();
  }
  if(d.presu){ t.presupuesto = numero(document.getElementById('nuevo-presu').value);
    guardar(); return pintar(); }
  if(d.limpiar){
    const e2 = registrarCompra(t);
    t.items = t.items.filter(i => !i.hecho);
    guardar(); cerrarHoja(); pintar();
    if(e2) verRecibo(t, e2);
    return;
  }
  if(d.copiar) return copiar(b, t);

  if(d.color){ colorElegido = d.color;
    document.querySelectorAll('[data-color]').forEach(x =>
      x.setAttribute('aria-pressed', x.dataset.color === d.color)); return; }
  if(d.cerrar) return cerrarHoja();
  if(d.recibo){
    const e3 = t.historial.find(x => String(x.pedido) === d.recibo);
    if(e3) verRecibo(t, e3);
    return;
  }
  if(d.cerrarRecibo){
    document.getElementById('capa-recibo').classList.remove('on');
    document.body.classList.remove('con-recibo');
    return;
  }
  if(d.copiarRecibo){
    const txt = textoRecibo();
    copiarTexto(txt).then(ok => avisarBoton(b, txt, ok));
    return;
  }
  if(d.crear){
    const nom = document.getElementById('h-nom').value.trim() || 'Mi lista';
    db.tiendas.push({id:id(), nombre:nom, color:colorElegido, historial:[],
      presupuesto:numero(document.getElementById('h-presu').value), items:[]});
    guardar(); cerrarHoja(); return pintar();
  }
  if(d.editarTienda){
    t.nombre = document.getElementById('h-nom').value.trim() || t.nombre;
    t.presupuesto = numero(document.getElementById('h-presu').value);
    t.color = colorElegido; guardar(); cerrarHoja(); return pintar();
  }
  if(d.duplicar){
    db.tiendas.push({id:id(), nombre:t.nombre + ' (copia)',
      color:PALETA[db.tiendas.length % PALETA.length], presupuesto:t.presupuesto, historial:[],
      items:t.items.map(i => ({...i, id:id(), hecho:false, contado:false}))});
    guardar(); cerrarHoja(); vista.pantalla = 'inicio'; window.scrollTo(0,0); return pintar();
  }
  if(d.borrarTienda){
    if(b.dataset.seguro){
      db.tiendas = db.tiendas.filter(x => x.id !== t.id);
      guardar(); cerrarHoja(); vista.pantalla = 'inicio'; return pintar();
    }
    b.dataset.seguro = '1';
    b.textContent = 'Toca otra vez para confirmar';
    b.classList.add('confirmar');
    return;
  }
});

document.getElementById('fondo').addEventListener('click', cerrarHoja);

document.addEventListener('input', e => {
  if(e.target.id !== 'f-nom') return;
  const p = document.getElementById('f-precio');
  if(!p) return;
  const t = tienda();
  const s = t ? precioSugerido(e.target.value, t.id) : 0;
  p.placeholder = s ? dinero(s) + ' (último)' : '$ c/u';
});

document.addEventListener('change', e => {
  if(e.target.id === 'archivo-copia'){
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const lector = new FileReader();
    lector.onload = () => aplicarCopia(String(lector.result));
    lector.onerror = () => aplicarCopia('');
    lector.readAsText(f);
    e.target.value = '';
    return;
  }
  if(e.target.id !== 'h-destino') return;
  const caja = document.getElementById('caja-nom');
  if(caja) caja.style.display = e.target.value === 'nueva' ? 'block' : 'none';
});

document.addEventListener('submit', e => {
  if(e.target.id !== 'form') return;
  e.preventDefault();
  const t = tienda();
  const n = document.getElementById('f-nom');
  const nombre = n.value.trim();
  if(!nombre) return;
  let precio = numero(document.getElementById('f-precio').value);
  if(!precio) precio = precioSugerido(nombre, t.id);
  t.items.push({id:id(), nombre, cant:document.getElementById('f-cant').value.trim(),
    precio, hecho:false});
  recordar(nombre, precio, t.id);
  guardar(); pintar();
  const nn = document.getElementById('f-nom');
  if(nn){ nn.focus(); nn.scrollIntoView({block:'center', behavior:'smooth'}); }
});

/* el portapapeles moderno no funciona en archivos locales: hay plan B */
function copiarTexto(txt){
  return new Promise(resolve => {
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(() => resolve(true)).catch(() => resolve(viejoCopiar(txt)));
    } else resolve(viejoCopiar(txt));
  });
}
function viejoCopiar(txt){
  try{
    const a = document.createElement('textarea');
    a.value = txt;
    a.setAttribute('readonly','');
    a.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(a);
    a.focus(); a.select(); a.setSelectionRange(0, txt.length);
    const bien = document.execCommand('copy');
    document.body.removeChild(a);
    return bien;
  }catch(e){ return false; }
}
/* si nada funciona, mostramos el texto para copiarlo a mano */
function mostrarTexto(txt){
  abrirHoja('<h2>Copia el texto</h2>'
    + '<p class="muted" style="margin:4px 0 10px">Tu navegador no deja copiar solo. '
    + 'Mantén presionado el texto, selecciona todo y cópialo.</p>'
    + '<textarea id="h-texto" rows="9" style="width:100%;font-family:Cuerpo,monospace;'
    + 'font-size:.85rem;background:#fff;border:1px solid var(--line2);border-radius:12px;'
    + 'padding:10px;color:var(--ink)"></textarea>'
    + '<div class="acciones"><button class="btn btn-main" data-cerrar="1">Listo</button></div>');
  const c = document.getElementById('h-texto');
  if(c){ c.value = txt; c.focus(); c.select(); }
}
function avisarBoton(btn, txt, ok){
  const old = btn.dataset.txt || btn.textContent;
  btn.dataset.txt = old;
  if(ok){ btn.textContent = '¡Copiado!'; setTimeout(() => { btn.textContent = old; }, 1600); }
  else mostrarTexto(txt);
}

async function copiar(btn, t){
  if(!t.items.length) return;
  let txt = t.nombre.toUpperCase() + '\n';
  const grupos = {};
  t.items.forEach(i => { const c = catDe(i); (grupos[c] = grupos[c] || []).push(i); });
  ORDEN.filter(c => grupos[c]).forEach(c => {
    txt += '\n' + c + '\n';
    grupos[c].forEach(i => {
      const x = [i.cant ? 'x' + i.cant : '', i.precio ? dinero(i.precio) + ' c/u' : ''].filter(Boolean).join(' ');
      txt += (i.hecho ? '[x] ' : '[ ] ') + (i.clave ? '* ' : '') + i.nombre
        + (x ? '  (' + x + ')' : '') + '\n';
    });
  });
  const c = cuentas(t);
  txt += '\nTotal: ' + dinero(c.total) + (t.presupuesto ? '  |  Presupuesto: ' + dinero(t.presupuesto) : '') + '\n';
  avisarBoton(btn, txt, await copiarTexto(txt));
}

      '#nl-badge-frame, [id*="nl-badge"], iframe[src*="netlify"][src*="badge"]');

  try{ new MutationObserver(mirar).observe(document.documentElement,
    {childList:true, subtree:true}); }catch(e){}
  setTimeout(mirar, 1200);
  setTimeout(mirar, 4000);
})();
